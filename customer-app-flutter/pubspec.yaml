name: uzum_tezkor_customer
description: Uzum Tezkor — mijoz mobil ilovasi (ovqat yetkazib berish)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Tarmoq
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Xavfsiz saqlash (JWT tokenlar)
  flutter_secure_storage: ^9.2.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2

  # Xarita va joylashuv
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Real-time
  socket_io_client: ^2.0.3+1

  # Push notification
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.4

  # Ijtimoiy tarmoq orqali kirish
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Yordamchi
  intl: ^0.19.0
  equatable: ^2.0.5
  flutter_animate: ^4.5.0
  url_launcher: ^6.3.0
  pin_code_fields: ^8.0.1
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
